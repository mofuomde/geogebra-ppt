<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>正方体11种展开图</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="https://www.geogebra.org/apps/deployggb.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#fff; font-family:"Microsoft YaHei",Arial,sans-serif; }
    #page { width:100%; height:100%; display:grid; grid-template-rows:58px 1fr; overflow:hidden; }
    #controls { display:grid; grid-template-columns:auto minmax(120px,1fr) auto auto minmax(120px,1fr) auto; align-items:center; gap:10px; padding:8px 14px; border-bottom:1px solid #ddd; background:#fff; z-index:5; font-size:15px; }
    #controls input[type="range"] { width:100%; min-width:0; }
    .value { min-width:32px; text-align:center; font-weight:600; }
    #ggb-wrap, #ggb-element { width:100%; height:100%; min-width:0; min-height:0; overflow:hidden; }
    @media (max-width:650px) {
      #page { grid-template-rows:92px 1fr; }
      #controls { grid-template-columns:auto 1fr auto; grid-template-rows:1fr 1fr; gap:4px 8px; font-size:13px; }
    }
  </style>
</head>
<body>
<div id="page">
  <div id="controls">
    <span>展开图 n</span>
    <input id="nSlider" type="range" min="1" max="11" step="1" value="1">
    <span id="nValue" class="value">1</span>
    <span>展开 t</span>
    <input id="tSlider" type="range" min="0" max="1" step="0.01" value="1">
    <span id="tValue" class="value">1.00</span>
  </div>
  <div id="ggb-wrap" class="ggb-container">
    <div id="ggb-element"></div>
  </div>
</div>
<script>
let api = null;

function setN(v) {
  document.getElementById("nValue").textContent = v;
  if (api) api.setValue("n", Number(v));
}

function setT(v) {
  document.getElementById("tValue").textContent = Number(v).toFixed(2);
  if (api) api.setValue("t", Number(v));
}

function initGeoGebra() {
  const params = {
    id: "ggbApplet",
    material_id: "gsadt52a",
    appName: "classic",
    scaleContainerClass: "ggb-container",
    autoHeight: false,
    allowUpscale: true,
    showMenuBar: false,
    showToolBar: false,
    showToolBarHelp: false,
    showAlgebraInput: false,
    showResetIcon: true,
    showZoomButtons: true,
    enableShiftDragZoom: true,
    enableRightClick: false,
    errorDialogsActive: false,
    enableFileFeatures: false,
    appletOnLoad: function(ggb) {
      api = ggb;
      try { api.setPerspective("T"); } catch (e) {}
      try { api.setAxesVisible(3, false, false, false); } catch (e) {}
      try { api.setGridVisible(3, false); } catch (e) {}
      try { api.evalCommand('SetVisibleInView(xOyPlane,-1,false)'); } catch (e) {}
      setN(document.getElementById("nSlider").value);
      setT(document.getElementById("tSlider").value);
      setTimeout(function() {
        try { api.recalculateEnvironments(); } catch (e) {}
      }, 300);
    }
  };
  const applet = new GGBApplet(params, true);
  applet.inject("ggb-element");
}

document.getElementById("nSlider").addEventListener("input", e => setN(e.target.value));
document.getElementById("tSlider").addEventListener("input", e => setT(e.target.value));
window.addEventListener("resize", function() {
  if (api) {
    try { api.recalculateEnvironments(); } catch (e) {}
  }
});

if (window.Office && Office.onReady) {
  Office.onReady(function() { initGeoGebra(); });
} else {
  window.addEventListener("load", initGeoGebra);
}
</script>
</body>
</html>
